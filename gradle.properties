org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
# Chaquopy 17 is not configuration-cache compatible (runs python at configuration time).
org.gradle.configuration-cache=false
android.useAndroidX=true
# Never modify the shared SDK; fail instead of auto-installing components.
android.builder.sdkDownload=false
# No Kotlin daemon, so nothing is written to ~/.local.
kotlin.compiler.execution.strategy=in-process
