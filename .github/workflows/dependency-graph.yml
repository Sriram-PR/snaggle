name: dependency-graph

# Replaces GitHub's Automatic Dependency Submission (turn that off): submit only what the APKs ship,
# so Dependabot alerts aren't drowned out by AGP/Chaquopy build tooling.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dependency-graph
  cancel-in-progress: true

permissions: {}

jobs:
  submit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write   # dependency snapshots API
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.tools/gradle-home
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install SDK components
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "build-tools;36.1.0" > /dev/null

      - uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          dependency-graph-include-configurations: '.*[Rr]eleaseRuntimeClasspath'
